# Trigger v4 Webapp (split): exposed by Coolify's Traefik (no ports)
# Includes Postgres, Redis, Electric, ClickHouse and MinIO as in the official v4 template.
# Secrets automatically generated by Coolify (SERVICE_PASSWORD_*).

services:
  webapp:
    image: 'ghcr.io/triggerdotdev/trigger.dev:v4.5.4'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      electric:
        condition: service_healthy
      minio:
        condition: service_healthy
      s2:
        condition: service_started
    volumes:
      - 'shared:/home/node/shared'
    user: root
    command: 'sh -c "chown -R node:node /home/node/shared && exec ./scripts/entrypoint.sh"'
    environment:
      - SERVICE_FQDN_WEBAPP_3000
      - REMIX_APP_PORT=3000
      - 'APP_ORIGIN=${SERVICE_URL_WEBAPP}'
      - 'LOGIN_ORIGIN=${SERVICE_URL_WEBAPP}'
      - 'API_ORIGIN=${SERVICE_URL_WEBAPP}'
      - 'SESSION_SECRET=${SERVICE_PASSWORD_SESSION}'
      - 'MAGIC_LINK_SECRET=${SERVICE_PASSWORD_MAGIC}'
      - 'ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPTION}'
      - 'MANAGED_WORKER_SECRET=${SERVICE_PASSWORD_MANAGEDWORKER}'
      - 'DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-trigger}?schema=public&sslmode=disable'
      - 'DIRECT_URL=postgresql://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-trigger}?schema=public&sslmode=disable'
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TLS_DISABLED=true
      - 'ELECTRIC_ORIGIN=http://electric:3000'
      # Realtime Streams v2 powers durable chat.agent input/output streams.
      - 'REALTIME_STREAMS_DEFAULT_VERSION=${REALTIME_STREAMS_DEFAULT_VERSION:-v2}'
      - 'REALTIME_STREAMS_S2_BASIN=${REALTIME_STREAMS_S2_BASIN:-trigger-realtime}'
      - 'REALTIME_STREAMS_S2_ENDPOINT=${REALTIME_STREAMS_S2_ENDPOINT:-http://s2/v1}'
      - 'REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS=${REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS:-true}'
      # s2-lite skips authentication, but the Sessions SDK still requires a
      # non-empty credential header. "ignored" is the upstream dummy value.
      - 'REALTIME_STREAMS_S2_ACCESS_TOKEN=${REALTIME_STREAMS_S2_ACCESS_TOKEN:-ignored}'
      - 'DEV_OTEL_EXPORTER_OTLP_ENDPOINT=${SERVICE_URL_WEBAPP}/otel'
      - 'DEPLOY_REGISTRY_HOST=${DEPLOY_REGISTRY_HOST}'
      - 'DEPLOY_REGISTRY_NAMESPACE=${DEPLOY_REGISTRY_NAMESPACE:-trigger}'
      - 'DEPLOY_REGISTRY_USERNAME=${DEPLOY_REGISTRY_USERNAME}'
      - 'DEPLOY_REGISTRY_PASSWORD=${DEPLOY_REGISTRY_PASSWORD}'
      - 'OBJECT_STORE_BASE_URL=http://minio:9000'
      - OBJECT_STORE_ACCESS_KEY_ID=admin
      - 'OBJECT_STORE_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}'
      - TRIGGER_BOOTSTRAP_ENABLED=1
      - TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME=bootstrap
      - TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH=/home/node/shared/worker_token
      - 'CLICKHOUSE_URL=http://${SERVICE_USER_CLICKHOUSE:-default}:${SERVICE_PASSWORD_64_CLICKHOUSE}@clickhouse:8123?secure=false'
      - CLICKHOUSE_LOG_LEVEL=info
      # Store new run events/timeline/spans in ClickHouse. Required for
      # llm_metrics / Models usage views that aggregate GenAI spans.
      - LLM_COST_TRACKING_ENABLED=true
      - LLM_PRICING_SEED_ON_STARTUP=true
      - EVENT_REPOSITORY_DEFAULT_STORE=clickhouse_v2
      - RUN_REPLICATION_ENABLED=1
      - 'RUN_REPLICATION_CLICKHOUSE_URL=http://${SERVICE_USER_CLICKHOUSE:-default}:${SERVICE_PASSWORD_64_CLICKHOUSE}@clickhouse:8123'
      - RUN_REPLICATION_LOG_LEVEL=info
      - APP_LOG_LEVEL=info
      - TRIGGER_TELEMETRY_DISABLED=1
      - 'COOLIFY_APP_NAME=${COOLIFY_APP_NAME}'
      - 'COOLIFY_ENVIRONMENT_NAME=${COOLIFY_ENVIRONMENT_NAME}'
      - 'COOLIFY_PROJECT_NAME=${COOLIFY_PROJECT_NAME}'
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "require('http').get('http://127.0.0.1:3000/healthcheck', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  postgres:
    image: 'postgres:16-alpine'
    restart: unless-stopped
    command:
      - '-c'
      - wal_level=logical
    environment:
      POSTGRES_USER: '${SERVICE_USER_POSTGRES:-postgres}'
      POSTGRES_PASSWORD: '${SERVICE_PASSWORD_POSTGRES}'
      POSTGRES_DB: '${POSTGRES_DB:-trigger}'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: 'redis:7'
    restart: unless-stopped
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  electric:
    image: 'electricsql/electric:1.2.4'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-trigger}?schema=public&sslmode=disable'
      ELECTRIC_INSECURE: 'true'
      ELECTRIC_USAGE_REPORTING: 'false'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:3000/v1/health'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional one-time, offline migration from the archived Bitnami layout.
  # Fresh mode skips the copy and leaves the legacy volume untouched.
  clickhouse-migrate:
    image: 'clickhouse/clickhouse-server:26.2.19.43@sha256:c2f2605585899d5103a0447daadbc0005f362200d5f0fcca7f40db3ca0dd36dd'
    restart: 'no'
    user: '0:0'
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        set -Eeuo pipefail

        source_dir=/legacy/data
        target_dir=/var/lib/clickhouse
        migration_marker="$$target_dir/.trigger-clickhouse-26.2-migrated"
        fresh_marker="$$target_dir/.trigger-clickhouse-26.2-fresh"

        case "$${CLICKHOUSE_STORAGE_INIT_MODE:-fresh}" in
          fresh)
            if [ -f "$$migration_marker" ]; then
              echo 'Fresh mode refused because this target contains a completed Bitnami migration.' >&2
              exit 1
            fi
            if find "$$target_dir" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
              if [ ! -f "$$fresh_marker" ]; then
                echo 'Fresh mode refused because the target is non-empty and has no fresh initialization marker.' >&2
                exit 1
              fi
              echo 'Fresh ClickHouse storage already initialized; legacy data remains untouched.'
              exit 0
            fi
            touch "$$fresh_marker"
            sync "$$fresh_marker"
            echo 'Fresh ClickHouse storage selected; legacy data will not be copied or modified.'
            exit 0
            ;;
          migrate-bitnami)
            ;;
          *)
            echo 'CLICKHOUSE_STORAGE_INIT_MODE must be migrate-bitnami or fresh.' >&2
            exit 1
            ;;
        esac

        if [ -f "$$migration_marker" ]; then
          if [ ! -d "$$target_dir/metadata" ] || [ ! -d "$$target_dir/store" ]; then
            echo 'Migration marker exists, but the expected ClickHouse data directories are missing.' >&2
            exit 1
          fi
          echo 'ClickHouse data migration already completed.'
          exit 0
        fi

        if find "$$target_dir" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
          echo 'Refusing to overwrite a non-empty ClickHouse 26.2 target volume.' >&2
          exit 1
        fi

        if [ -d "$$source_dir" ] && find "$$source_dir" -mindepth 1 -print -quit | grep -q .; then
          if [ ! -d "$$source_dir/metadata" ] || [ ! -d "$$source_dir/store" ]; then
            echo 'Legacy ClickHouse data does not contain the expected metadata/ and store/ directories.' >&2
            exit 1
          fi

          if timeout 2 bash -c 'exec 3<>/dev/tcp/clickhouse/8123' 2>/dev/null; then
            echo 'Legacy ClickHouse is still reachable; stop the complete stack before migration.' >&2
            exit 1
          fi

          if [ "$${CLICKHOUSE_MIGRATION_ACK:-}" != 'offline-copy-confirmed' ]; then
            echo 'Set CLICKHOUSE_MIGRATION_ACK=offline-copy-confirmed only after stopping the complete Webapp stack.' >&2
            exit 1
          fi

          source_kb="$$(du -sk "$$source_dir" | awk '{print $$1}')"
          available_kb="$$(df -Pk "$$target_dir" | awk 'NR == 2 {print $$4}')"
          required_kb="$$((source_kb + source_kb / 3))"
          if [ "$$available_kb" -lt "$$required_kb" ]; then
            echo "Insufficient free space: need at least $${required_kb} KiB, have $${available_kb} KiB." >&2
            exit 1
          fi

          echo 'Copying legacy ClickHouse data to the 26.2 volume...'
          cp -a --reflink=auto --sparse=always "$$source_dir"/. "$$target_dir"/

          source_entries="$$(find "$$source_dir" -xdev -mindepth 1 -printf . | wc -c)"
          target_entries="$$(find "$$target_dir" -xdev -mindepth 1 -printf . | wc -c)"
          source_bytes="$$(find "$$source_dir" -xdev -type f -printf '%s\n' | awk '{ total += $$1 } END { print total + 0 }')"
          target_bytes="$$(find "$$target_dir" -xdev -type f -printf '%s\n' | awk '{ total += $$1 } END { print total + 0 }')"
          if [ "$$source_entries" -ne "$$target_entries" ] || [ "$$source_bytes" -ne "$$target_bytes" ]; then
            echo 'ClickHouse copy verification failed; the completion marker was not created.' >&2
            exit 1
          fi

          # The lock file is runtime state; never carry it into the cloned volume.
          rm -f "$$target_dir/status"

          # Bitnami stores data/tmp as an absolute symlink into /opt/bitnami.
          # It is invalid in the official image after relocating data/ to the root.
          if [ -L "$$target_dir/tmp" ]; then
            echo "Replacing legacy tmp symlink: $$(readlink "$$target_dir/tmp")"
            rm "$$target_dir/tmp"
            mkdir -p "$$target_dir/tmp"
          elif [ -e "$$target_dir/tmp" ] && [ ! -d "$$target_dir/tmp" ]; then
            echo 'The migrated ClickHouse tmp path is neither a directory nor a symlink.' >&2
            exit 1
          else
            mkdir -p "$$target_dir/tmp"
          fi
        else
          echo 'Legacy ClickHouse data is missing or empty. Verify that this is the same Coolify resource and volume.' >&2
          exit 1
        fi

        clickhouse_uid="$$(id -u clickhouse)"
        clickhouse_gid="$$(id -g clickhouse)"
        chown -R "$$clickhouse_uid:$$clickhouse_gid" "$$target_dir"
        sync
        touch "$$migration_marker"
        sync "$$migration_marker"
        echo 'ClickHouse data migration completed.'
    environment:
      CLICKHOUSE_MIGRATION_ACK: '${CLICKHOUSE_MIGRATION_ACK:-}'
      CLICKHOUSE_STORAGE_INIT_MODE: '${CLICKHOUSE_STORAGE_INIT_MODE:-fresh}'
    volumes:
      - 'clickhouse-data:/legacy:ro'
      - type: volume
        source: clickhouse-data-v26-2
        target: /var/lib/clickhouse
        volume:
          nocopy: true

  clickhouse:
    image: 'clickhouse/clickhouse-server:26.2.19.43@sha256:c2f2605585899d5103a0447daadbc0005f362200d5f0fcca7f40db3ca0dd36dd'
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_USER: '${SERVICE_USER_CLICKHOUSE:-default}'
      CLICKHOUSE_PASSWORD: '${SERVICE_PASSWORD_64_CLICKHOUSE}'
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - type: volume
        source: clickhouse-data-v26-2
        target: /var/lib/clickhouse
        volume:
          nocopy: true
    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - '--host'
        - localhost
        - '--port'
        - '9000'
        - '--user'
        - '${SERVICE_USER_CLICKHOUSE:-default}'
        - '--password'
        - '${SERVICE_PASSWORD_64_CLICKHOUSE}'
        - '--query'
        - 'SELECT 1'
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s
  minio:
    image: 'bitnamilegacy/minio:latest'
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: '${SERVICE_PASSWORD_MINIO}'
      MINIO_DEFAULT_BUCKETS: packets
      MINIO_BROWSER: 'on'
    volumes:
      - 'minio-data:/bitnami/minio/data'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:9000/minio/health/live'
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Generates the basin definition consumed by the distroless s2-lite image.
  s2-init:
    image: 'busybox:1.37'
    restart: 'no'
    environment:
      REALTIME_STREAMS_S2_BASIN: '${REALTIME_STREAMS_S2_BASIN:-trigger-realtime}'
    command:
      - sh
      - -c
      - |
        cat > /config/s2-spec.json <<JSON
        {
          "basins": [
            {
              "name": "$$REALTIME_STREAMS_S2_BASIN",
              "config": { "create_stream_on_append": true, "create_stream_on_read": true }
            }
          ]
        }
        JSON
    volumes:
      - 's2-config:/config'

  # Realtime Streams v2 storage used by Trigger.dev Sessions and chat.agent.
  s2:
    image: '${S2_IMAGE:-ghcr.io/s2-streamstore/s2:latest@sha256:d6ded5ca7dd619fa7c946f06e39a98f9c95c6883c8bb884e5eaa129f232c920c}'
    restart: unless-stopped
    ports:
      - '10.21.30.15:4566:80'
    depends_on:
      s2-init:
        condition: service_completed_successfully
    command: ['lite', '--init-file', '/config/s2-spec.json', '--local-root', '/data']
    user: '0:0'
    volumes:
      - 's2-config:/config'
      - 's2-data:/data'
    # Task containers write directly to the endpoint returned by the Webapp.
    # Keep the default network for Webapp access and share the runner network
    # so http://s2/v1 resolves without exposing s2-lite publicly.
    networks:
      default:
      runner:
        aliases:
          - s2

volumes:
  shared:
  postgres-data:
  redis-data:
  # Retained as the immutable Bitnami source and rollback volume.
  clickhouse-data:
  clickhouse-data-v26-2:
  minio-data:
  s2-config:
  s2-data:

networks:
  runner:
    name: '${TRIGGER_RUNNER_NETWORK:-supervisor}'
    # The Webapp stack is deployed first and owns this shared runner network.
    # The Worker stack consumes it as external and ephemeral task containers
    # are attached through DOCKER_RUNNER_NETWORKS.
    driver: bridge
    attachable: true
